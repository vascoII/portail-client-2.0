parameters:
  mailer_transport: smtp
  mailer_host: 127.0.0.1
  mailer_user: null
  mailer_password: null
  locale: fr
  secret: m1EyDxag33VVcHWq26ZP
  debug_toolbar: true
  debug_redirects: false
  use_assetic_controller: true
  # Paramètres de connexion Oracle bas-niveau (OCI)
  oracle_dsn: '%env(ORACLE_DSN)%' 
  oracle_user: '%env(ORACLE_USER)%'
  oracle_password: '%env(ORACLE_PASSWORD)%'
  # Source des données factures : soap | oracle (migration GET)
  data_source_factures: '%env(default:data_source_factures_default:DATA_SOURCE_FACTURES)%'
  data_source_factures_default: soap
  sopa_url: '%env(SOAP_URL)%'
 
  adminSessionId: 0v728jqy-2cc0-4724-abc5-dbm1zwab9a3d
  superLoginID: "JOHN DOE"
  superPassword: DF93RN9F-SLJ528F
  service_client: App\Service\Client
  security.authentication.provider.soap.class: App\Security\AppCustomAuthenticator
  header.request_listener: App\Listener\HeaderListener
  cache_namespace: techemsoap
  cache_dir: "%kernel.project_dir%/cache"

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  App\Service\FakeDataService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Service\Client:
    arguments:
      $kernel: "@kernel"
      $wsdlUrl: "%sopa_url%"
      $adminSessionId: "%adminSessionId%"
      $cache: "@cache.app"
      $cacheNamespace: "%cache_namespace%"
      $superLoginID: "%superLoginID%"
      $superPassword: "%superPassword%"

  # Façade OCI utilisée par les repositories Oracle (ex: FactureRepository)
  App\Oracle\OciFacade:
    arguments:
      $dsn: '%oracle_dsn%'
      $user: '%oracle_user%'
      $password: '%oracle_password%'

  App\Oracle\OciUpdateHandler:
    arguments:
      $dsn: '%oracle_dsn%'
      $user: '%oracle_user%'
      $password: '%oracle_password%'

  security.authentication.provider.soap.class:
    class: App\Security\AppCustomAuthenticator
    abstract: true
    public: false
    arguments:
      - "@security.user_checker"
      - "~" # Provider-shared Key
      - '@App\Service\Client'
      - "%security.authentication.hide_user_not_found%"

  header.request_listener:
    class: App\Listener\HeaderListener
    tags:
      - {
          name: kernel.event_listener,
          event: kernel.request,
          method: onKernelRequest,
          priority: 7,
        }

  App\Listener\CorsListener:
    tags:
      - { name: kernel.event_subscriber }

